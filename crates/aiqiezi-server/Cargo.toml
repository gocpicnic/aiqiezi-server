[package]
name = "aiqiezi-server"
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0"
description = "Single-backend photo and video archive server"
repository = "https://github.com/gocpicnic/aiqiezi-server"

[dependencies]
aiqiezi-proto = { path = "../aiqiezi-proto" }
anyhow = "1"
argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
iroh = "1.0"
iroh-mdns-address-lookup = "0.4"
iroh-tickets = "1.0"
rand = "0.10"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
tempfile = "3"
