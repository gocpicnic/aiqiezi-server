name: aiqiezi

# Self-contained deployment file.
#
# Copy this file to the deployment directory, replace the placeholder values,
# and run `docker compose up -d`. The filled-in file contains secrets: set it
# to mode 0600 and never commit it.
#
# PostgreSQL is not part of the current stack. It will be added in Phase 2.

services:
  aiqiezi-server:
    image: ghcr.io/gocpicnic/aiqiezi-server:latest
    container_name: aiqiezi-server
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      AIQIEZI_UID: "1000"
      AIQIEZI_GID: "1000"
      AIQIEZI_DATA_DIR: /data
      AIQIEZI_RUNTIME_DIR: /run/aiqiezi
      AIQIEZI_BOOTSTRAP_PASSWORD: "ChangeMe-123!"
      # Reserved for Phase 2; the current server only validates the URL.
      AIQIEZI_DATABASE_URL: "postgres://unused:unused@127.0.0.1/unused"
      AIQIEZI_LOG_LEVEL: info
      # Optional iroh settings:
      # AIQIEZI_RELAY_URL: ""
      # AIQIEZI_RELAY_TOKEN: ""
      # AIQIEZI_DNS_SERVER: ""
      # AIQIEZI_BIND_ADDR: ""
    volumes:
      - /mnt/data/aiqiezi/media:/data/media
      - /mnt/data/aiqiezi/keys:/data/keys
      - /mnt/data/aiqiezi/config:/data/config
    healthcheck:
      test: ["CMD", "/usr/local/bin/aiqiezi-server", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
